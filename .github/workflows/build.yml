name: Build
on: [push, workflow_dispatch]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle --no-daemon assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: WindowsAirDrop-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
        working-directory: windows
      - run: pyinstaller --noconsole --onefile --name WindowsAirDrop windows_airdrop.py
        working-directory: windows
      - uses: actions/upload-artifact@v4
        with:
          name: WindowsAirDrop-windows-exe
          path: windows/dist/WindowsAirDrop.exe

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: mv dist/app-debug.apk dist/WindowsAirDrop.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: WindowsAirDrop (latest build)
          prerelease: true
          make_latest: true
          target_commitish: ${{ github.sha }}
          body: "Download WindowsAirDrop.exe for Windows, WindowsAirDrop.apk for Android."
          files: |
            dist/WindowsAirDrop.exe
            dist/WindowsAirDrop.apk
